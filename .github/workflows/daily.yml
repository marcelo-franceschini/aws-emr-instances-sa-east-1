# Coleta diária de instâncias EMR (sa-east-1) e publicação do JSON na branch data
name: EMR instances (sa-east-1)

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 09:00 UTC (06:00 em São Paulo)
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions

permissions:
  contents: write          # necessário para publicar na branch "data"

concurrency:
  group: emr-instances
  cancel-in-progress: false

# As ações ficam fixadas por SHA, com a versão no comentário: tag pode ser movida,
# e este job roda com as chaves AWS e com permissão de escrita no repo.
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # a coleta leva uns 4 min; travada, não segura a fila por 6 h
    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # o token de escrita não fica em disco durante a coleta

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Instalar uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2

      - name: Sincronizar dependências (travadas no lockfile)
        run: uv sync --frozen

      - name: Gerar o JSON
        run: uv run emr-collect

      - name: Publicar o JSON na branch data
        env:
          GH_TOKEN: ${{ github.token }}   # só este passo recebe a credencial de escrita
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # tira o JSON gerado do working tree para poder trocar de branch sem conflito
          mv instances_sa-east-1.json /tmp/instances.json
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data --depth 1
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mv /tmp/instances.json instances_sa-east-1.json
          git add instances_sa-east-1.json
          if git diff --cached --quiet; then
            echo "JSON sem alteração — nada a commitar."
          else
            git commit -m "data: atualiza instances_sa-east-1.json ($(date -u +%FT%TZ))"
            # o checkout não guardou credencial; o repo é público, então só o push a usa
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          fi
