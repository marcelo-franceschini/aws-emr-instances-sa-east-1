[project]
name = "aws-emr-instances-sa-east-1"
version = "0.1.0"
description = "Coleta diária de instâncias EMR suportadas em sa-east-1 com preços on-demand e spot, com notificação via Pushover"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.54",
    "requests>=2.32.0",
]

[project.scripts]
emr-collect = "emr_instances.cli.collect:main"
emr-notify = "emr_instances.cli.notify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# o nome normalizado do projeto não bate com o do pacote, então é explícito
packages = ["src/emr_instances"]

[dependency-groups]
dev = [
    "boto3-stubs[ec2,emr,pricing]>=1.43.54",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.14",
    "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
