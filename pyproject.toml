[project]
name = "aws-emr-instances-sa-east-1"
version = "0.1.0"
description = "Coleta diária de instâncias EMR suportadas em sa-east-1 com preços on-demand e spot, com notificação via Pushover"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.54",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
