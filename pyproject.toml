[project]
name = "aws-emr-instances-sa-east-1"
version = "0.1.0"
description = "Coleta diária de instâncias EMR suportadas em sa-east-1 com preços on-demand e spot, com notificação via Pushover"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.54",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[ec2,emr,pricing]>=1.43.54",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.14",
    "types-requests>=2.32.0",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
